{% set name = "wasabi" %}
{% set version = "1.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4bb3008f003809db0c3e28b4daf20906ea871a2bb43f9914197d540f4f2e0878

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<36]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python
    - typing-extensions <5.0.0,>=3.7.4.1  # [py<38]
    - colorama >=0.4.6  # [win and py>=37]

# jupyter_client.kernelspec.NoSuchKernel: No such kernel named python3
{% set deselect_tests = " --deselect=tests/test_jupyter.py::test_jupyter" %}

test:
  imports:
    - wasabi
  commands:
    - pip check
    - python -m pytest --tb=native --pyargs wasabi {{ deselect_tests }}
  requires:
    - pip 
    - pytest

about:
  home: https://github.com/ines/wasabi
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A lightweight console printing and formatting toolkit
  description: A lightweight console printing and formatting toolkit
  dev_url: https://github.com/ines/wasabi
  doc_url: https://github.com/ines/wasabi/blob/master/README.md

extra:
  recipe-maintainers:
    - ines
    - honnibal
    - adrianeboyd
